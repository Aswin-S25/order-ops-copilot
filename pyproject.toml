[project]
name = "order-ops-copilot"
version = "0.1.0"
description = "Production-grade agentic order-support system"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",           # async Postgres driver (OD-6)
    "alembic>=1.14",
    "redis>=5.2",
    "structlog>=24.4",
    "pgvector>=0.3",
    "argon2-cffi>=23.1",
    "pyjwt>=2.10",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.uv]
package = false   # this is an application, not a library: don't build or install it into .venv

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --import-mode=importlib"
markers = [
    "integration: needs the Docker Compose stack (Postgres + Redis)",
    "security: the security suite (run alone with -m security); must pass 100%",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: errors · I: import order · B: bug patterns · UP: modern syntax
# S: security (bandit rules) · ASYNC: async pitfalls
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

# Generated migrations: SQL inside CHECK constraints cannot be wrapped by the formatter.
"db/migrations/versions/*" = ["E501"]

[tool.alembic]
script_location = "%(here)s/db/migrations"
prepend_sys_path = ["."]

# Generated migrations are linted and formatted like hand-written code.
[[tool.alembic.post_write_hooks]]
name = "ruff_check"
type = "module"
module = "ruff"
options = "check --fix REVISION_SCRIPT_FILENAME"

[[tool.alembic.post_write_hooks]]
name = "ruff_format"
type = "module"
module = "ruff"
options = "format REVISION_SCRIPT_FILENAME"
