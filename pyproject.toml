[project]
name = "order-ops-copilot"
version = "0.1.0"
description = "Production-grade agentic order-support system"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",           # async Postgres driver (OD-6)
    "alembic>=1.14",
    "redis>=5.2",
    "structlog>=24.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.uv]
package = false   # this is an application, not a library: don't build or install it into .venv