[project]
name = "order-ops-copilot"
version = "0.1.0"
description = "Production-grade agentic order-support system"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",           # async Postgres driver (OD-6)
    "alembic>=1.14",
    "redis>=5.2",
    "structlog>=24.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.uv]
package = false   # this is an application, not a library: don't build or install it into .venv

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: errors · I: import order · B: bug patterns · UP: modern syntax
# S: security (bandit rules) · ASYNC: async pitfalls
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
